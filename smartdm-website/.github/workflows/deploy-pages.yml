name: Deploy SmartDM Website to Pages

on:
  push:
    branches: [ smartdm-website, main ]
    paths:
      - 'smartdm-website/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'smartdm-website/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
