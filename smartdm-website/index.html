<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#070916" />
  <meta name="description" content="SmartDM is an open-source, local-first, AI-powered download manager for Windows and Linux." />
  <meta property="og:title" content="SmartDM — Fast, intelligent, secure downloads" />
  <meta property="og:description" content="A modern open-source download manager with multi-segment acceleration, browser interception, media fetching, AI cataloging, and security checks." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/assets/smartdm-app.png" />
  <title>SmartDM — High-Speed Open Source AI Download Manager</title>
  <link rel="icon" href="/assets/logo-square.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script>
    window.addEventListener('error', function(e) {
      var errDiv = document.createElement('div');
      errDiv.style.cssText = 'position:fixed;inset:0;background:#070916;color:#ff6b8a;padding:50px;font-family:monospace;font-size:18px;z-index:999999;overflow:auto;';
      errDiv.innerHTML = '<h2>Script Error Detected:</h2><p>' + (e.message || e.error) + '</p><p>URL: ' + e.filename + ':' + e.lineno + '</p>';
      document.body.appendChild(errDiv);
    }, true);
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
