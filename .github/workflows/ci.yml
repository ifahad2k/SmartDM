name: CI

on:
  push:
    branches: [ "main", "sdm2.0" ]
  pull_request:
    branches: [ "main", "sdm2.0" ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

    - name: Set up .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore .NET Solution
      run: dotnet restore SmartDm.sln

    - name: Build .NET Solution
      run: dotnet build SmartDm.sln --no-restore

    - name: Run .NET Architecture & TLS Tests
      run: dotnet test SmartDm.sln --no-build

    - name: Test browser extraction and identity fixtures
      run: node --test tests/browser/*.test.cjs

    - name: Set up Java
      uses: actions/setup-java@99b8673ff64fbf99d8d325f52d9a5bdedb8483e9 # v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Validate Gradle wrapper
      uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4
      
    - name: Execute Gradle build (Linux)
      if: runner.os != 'Windows'
      run: ./gradlew clean check architectureTest

    - name: Execute Gradle build (Windows)
      if: runner.os == 'Windows'
      run: .\gradlew.bat clean check architectureTest
        
    - name: Upload Test Reports
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: always()
      with:
        name: test-reports-${{ matrix.os }}
        path: |
          **/build/reports/tests/
          **/TestResults/
